name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check ai_desktop/ tests/ scripts/release_check.py

      - name: Validate source version
        run: python scripts/release_check.py

      - name: Report Qt test runtime
        run: |
          python - <<'PY'
          import platform
          import sys
          from importlib.metadata import version
          from PyQt5.QtCore import qVersion
          print(sys.version)
          print(platform.platform())
          print(f"Qt runtime: {qVersion()}")
          for package in ("PyQt5", "PyQt5-sip", "PyQt-Fluent-Widgets", "pytest", "pytest-qt"):
              print(f"{package}: {version(package)}")
          PY

      - name: Test
        run: QT_QPA_PLATFORM=offscreen pytest tests/ -q
