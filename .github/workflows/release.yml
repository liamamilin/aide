name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check ai_desktop/ tests/

      - name: Test
        run: QT_QPA_PLATFORM=offscreen pytest tests/ -q

      - name: Build .app
        run: |
          pyinstaller --windowed --onedir --argv-emulation \
            --name "AI桌面助手" \
            --icon ai_desktop/图标.icns \
            --add-data "ai_desktop/图标.icns:ai_desktop" \
            --add-data "ai_desktop/图标.png:ai_desktop" \
            --hidden-import pynput.keyboard._darwin \
            --hidden-import pynput.mouse._darwin \
            --hidden-import pynput.keyboard._base \
            --hidden-import pynput.mouse._base \
            --exclude-module PyQt5.QtWebEngine \
            --exclude-module PyQt5.QtWebSockets \
            --exclude-module PyQt5.QtMultimedia \
            --exclude-module PyQt5.QtMultimediaWidgets \
            --exclude-module PyQt5.QtBluetooth \
            --exclude-module PyQt5.QtNfc \
            --exclude-module PyQt5.QtPositioning \
            --exclude-module PyQt5.QtSensors \
            --exclude-module PyQt5.QtQuick \
            --exclude-module PyQt5.QtQml \
            --exclude-module PyQt5.Qt3DCore \
            --exclude-module PyQt5.QtSql \
            --exclude-module PyQt5.QtTest \
            --exclude-module PyQt5.QtDBus \
            --exclude-module tkinter \
            --exclude-module matplotlib \
            --exclude-module scipy \
            ai_desktop/main.py

      - name: Build DMG
        run: |
          VERSION="${{ github.ref_name }}"
          bash scripts/build_dmg.sh "${VERSION#v}"

      - name: Upload DMG to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AI桌面助手-*.dmg
          generate_release_notes: true
