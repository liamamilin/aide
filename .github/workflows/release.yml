name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release tag and source version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python scripts/release_check.py \
            --version "$VERSION" \
            --require-clean \
            --require-tag

      - run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check ai_desktop/ tests/ scripts/release_check.py

      - name: Test
        run: QT_QPA_PLATFORM=offscreen pytest tests/ -q

      - name: Build, validate, smoke test, and package
        run: bash scripts/build.sh --smoke --dmg

      - name: Upload DMG to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AI桌面助手-*.dmg
          generate_release_notes: true
